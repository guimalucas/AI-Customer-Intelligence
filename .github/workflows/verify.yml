name: Verificação
on: [push, pull_request]

jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python review.py && python evaluation.py
      - run: git diff --exit-code -- data/evaluation_results.csv data/evaluation_results_classes.csv data/revisao_manual_template.csv
